name: Refresh from the career API

# The profile used to age silently: a promotion in January was still
# unmentioned in August. This rebuilds the generated half every week.

on:
  schedule:
    # Monday morning. Career data changes in months, not hours — a daily run
    # would be a daily no-op.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    # A template edit should show up without waiting for Monday.
    paths:
      - README.template.md
      - bin/generate.mjs
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: build
        run: node bin/generate.mjs

      - name: Commit if anything moved
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "sebss"
          git config user.email "sebssgarcia502580@gmail.com"
          git commit -am "profile: refresh from the career API"
          git push
